<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <!-- Background Elements -->
  <circle cx="300" cy="250" r="200" fill="#2E8B57" opacity="0.05"/>

  <!-- Field/Land -->
  <path d="M50 380 Q150 350 300 360 Q450 370 550 350 L550 450 Q450 470 300 460 Q150 450 50 470Z" fill="#8B6914" opacity="0.15"/>
  <path d="M80 370 Q200 345 300 355 Q400 365 520 345 L520 380 Q400 400 300 390 Q200 380 80 400Z" fill="#2E8B57" opacity="0.1"/>

  <!-- Rows of Crops -->
  <g opacity="0.9">
    <!-- Row 1 -->
    <g transform="translate(120, 340)">
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#2E8B57" stroke-width="3"/>
      <ellipse cx="-10" cy="-35" rx="12" ry="8" fill="#3DA86A" transform="rotate(-20 -10 -35)"/>
      <ellipse cx="10" cy="-40" rx="12" ry="8" fill="#2E8B57" transform="rotate(20 10 -40)"/>
    </g>
    <g transform="translate(180, 335)">
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#2E8B57" stroke-width="3"/>
      <ellipse cx="-10" cy="-40" rx="12" ry="8" fill="#3DA86A" transform="rotate(-20 -10 -40)"/>
      <ellipse cx="10" cy="-45" rx="12" ry="8" fill="#2E8B57" transform="rotate(20 10 -45)"/>
    </g>
    <g transform="translate(240, 340)">
      <line x1="0" y1="0" x2="0" y2="-42" stroke="#2E8B57" stroke-width="3"/>
      <ellipse cx="-10" cy="-37" rx="12" ry="8" fill="#3DA86A" transform="rotate(-20 -10 -37)"/>
      <ellipse cx="10" cy="-42" rx="12" ry="8" fill="#2E8B57" transform="rotate(20 10 -42)"/>
    </g>
    <g transform="translate(300, 345)">
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#2E8B57" stroke-width="3"/>
      <ellipse cx="-10" cy="-35" rx="12" ry="8" fill="#3DA86A" transform="rotate(-20 -10 -35)"/>
      <ellipse cx="10" cy="-40" rx="12" ry="8" fill="#2E8B57" transform="rotate(20 10 -40)"/>
    </g>
    <g transform="translate(360, 340)">
      <line x1="0" y1="0" x2="0" y2="-43" stroke="#2E8B57" stroke-width="3"/>
      <ellipse cx="-10" cy="-38" rx="12" ry="8" fill="#3DA86A" transform="rotate(-20 -10 -38)"/>
      <ellipse cx="10" cy="-43" rx="12" ry="8" fill="#2E8B57" transform="rotate(20 10 -43)"/>
    </g>
    <g transform="translate(420, 335)">
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#2E8B57" stroke-width="3"/>
      <ellipse cx="-10" cy="-35" rx="12" ry="8" fill="#3DA86A" transform="rotate(-20 -10 -35)"/>
      <ellipse cx="10" cy="-40" rx="12" ry="8" fill="#2E8B57" transform="rotate(20 10 -40)"/>
    </g>
    <g transform="translate(480, 340)">
      <line x1="0" y1="0" x2="0" y2="-38" stroke="#2E8B57" stroke-width="3"/>
      <ellipse cx="-10" cy="-33" rx="12" ry="8" fill="#3DA86A" transform="rotate(-20 -10 -33)"/>
      <ellipse cx="10" cy="-38" rx="12" ry="8" fill="#2E8B57" transform="rotate(20 10 -38)"/>
    </g>
  </g>

  <!-- Central Farmer/Worker Figure -->
  <g transform="translate(300, 200)">
    <!-- Body -->
    <circle cx="0" cy="-50" r="25" fill="#1E3A8A" opacity="0.9"/>
    <!-- Hat -->
    <ellipse cx="0" cy="-72" rx="30" ry="8" fill="#8B6914"/>
    <rect x="-18" y="-85" width="36" height="15" rx="5" fill="#A0781E"/>
    <!-- Face -->
    <circle cx="0" cy="-50" r="18" fill="#F5D6B8"/>
    <!-- Smile -->
    <path d="M-6 -44 Q0 -38 6 -44" stroke="#8B6914" stroke-width="2" fill="none"/>
    <!-- Eyes -->
    <circle cx="-6" cy="-53" r="2" fill="#333"/>
    <circle cx="6" cy="-53" r="2" fill="#333"/>
    <!-- Shirt -->
    <path d="M-20 -25 Q-25 0 -20 30 L20 30 Q25 0 20 -25Z" fill="#2E8B57"/>
    <!-- Arms -->
    <path d="M-20 -15 Q-45 -5 -55 10" stroke="#F5D6B8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M20 -15 Q45 -5 55 10" stroke="#F5D6B8" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Spray bottle in hand -->
    <g transform="translate(55, 15)">
      <rect x="-5" y="-15" width="10" height="25" rx="3" fill="#4FC3F7"/>
      <rect x="-3" y="-20" width="6" height="8" rx="2" fill="#0288D1"/>
      <line x1="5" y1="-12" x2="15" y2="-20" stroke="#0288D1" stroke-width="3" stroke-linecap="round"/>
      <!-- Spray particles -->
      <circle cx="20" cy="-25" r="2" fill="#4FC3F7" opacity="0.6"/>
      <circle cx="25" cy="-30" r="1.5" fill="#4FC3F7" opacity="0.4"/>
      <circle cx="18" cy="-32" r="1.5" fill="#4FC3F7" opacity="0.5"/>
    </g>
    <!-- Legs -->
    <rect x="-12" y="30" width="10" height="35" rx="4" fill="#1E3A8A"/>
    <rect x="2" y="30" width="10" height="35" rx="4" fill="#1E3A8A"/>
    <!-- Shoes -->
    <ellipse cx="-7" cy="68" rx="10" ry="5" fill="#5D4037"/>
    <ellipse cx="7" cy="68" rx="10" ry="5" fill="#5D4037"/>
  </g>

  <!-- Sun -->
  <circle cx="500" cy="80" r="40" fill="#FFD700" opacity="0.3"/>
  <circle cx="500" cy="80" r="30" fill="#FFD700" opacity="0.5"/>
  <circle cx="500" cy="80" r="20" fill="#FFD700" opacity="0.7"/>
  <!-- Sun rays -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.3">
    <line x1="500" y1="30" x2="500" y2="15"/>
    <line x1="535" y1="45" x2="548" y2="35"/>
    <line x1="550" y1="80" x2="565" y2="80"/>
    <line x1="535" y1="115" x2="548" y2="125"/>
    <line x1="500" y1="130" x2="500" y2="145"/>
    <line x1="465" y1="115" x2="452" y2="125"/>
    <line x1="450" y1="80" x2="435" y2="80"/>
    <line x1="465" y1="45" x2="452" y2="35"/>
  </g>

  <!-- Floating Product Bottles -->
  <g transform="translate(90, 150)" opacity="0.8">
    <rect x="0" y="0" width="30" height="50" rx="5" fill="#E53935"/>
    <rect x="5" y="-8" width="20" height="12" rx="3" fill="#C62828"/>
    <text x="15" y="30" text-anchor="middle" fill="white" font-size="7" font-weight="bold">AGR</text>
  </g>

  <g transform="translate(470, 130)" opacity="0.8">
    <rect x="0" y="0" width="30" height="50" rx="5" fill="#1565C0"/>
    <rect x="5" y="-8" width="20" height="12" rx="3" fill="#0D47A1"/>
    <text x="15" y="30" text-anchor="middle" fill="white" font-size="7" font-weight="bold">PRO</text>
  </g>

  <!-- Checkmark badges -->
  <g transform="translate(140, 100)">
    <circle cx="0" cy="0" r="15" fill="#2E8B57"/>
    <path d="M-6 0 L-2 4 L6 -4" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(460, 90)">
    <circle cx="0" cy="0" r="15" fill="#FFD700"/>
    <path d="M-6 0 L-2 4 L6 -4" stroke="#1E3A8A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
