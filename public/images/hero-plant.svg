<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2E8B57" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2E8B57" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="60%" r="40%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#236B43"/>
      <stop offset="100%" stop-color="#2E8B57"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8B57"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>

  <circle cx="300" cy="300" r="250" fill="url(#glow1)"/>
  <circle cx="300" cy="330" r="180" fill="url(#glow2)"/>
  <circle cx="300" cy="320" r="200" stroke="#2E8B57" stroke-width="1" stroke-dasharray="8 6" opacity="0.15" fill="none"/>

  <!-- Ground -->
  <ellipse cx="300" cy="510" rx="180" ry="25" fill="#2E8B57" opacity="0.1"/>
  <ellipse cx="300" cy="510" rx="130" ry="15" fill="#8B6914" opacity="0.15"/>

  <!-- Main Stem -->
  <path d="M300 505 C298 460 296 400 294 350 C292 310 296 270 300 230 C304 190 300 160 300 130" stroke="url(#stemGrad)" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- Branches -->
  <path d="M296 380 C270 365 240 350 210 340" stroke="#3DA86A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M304 360 C330 345 360 330 390 320" stroke="#3DA86A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M295 300 C265 285 235 275 205 265" stroke="#3DA86A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M305 280 C335 265 365 255 395 245" stroke="#3DA86A" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M298 230 C280 215 260 200 240 190" stroke="#3DA86A" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M302 210 C320 195 340 185 360 175" stroke="#3DA86A" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Leaves Left -->
  <ellipse cx="195" cy="332" rx="48" ry="22" fill="#2E8B57" transform="rotate(-25 195 332)"/>
  <ellipse cx="190" cy="260" rx="42" ry="20" fill="#3DA86A" transform="rotate(-15 190 260)"/>
  <ellipse cx="228" cy="186" rx="35" ry="18" fill="#2E8B57" transform="rotate(-35 228 186)"/>

  <!-- Leaves Right -->
  <ellipse cx="405" cy="312" rx="48" ry="22" fill="#3DA86A" transform="rotate(25 405 312)"/>
  <ellipse cx="410" cy="240" rx="42" ry="20" fill="#2E8B57" transform="rotate(15 410 240)"/>
  <ellipse cx="372" cy="172" rx="35" ry="18" fill="#3DA86A" transform="rotate(35 372 172)"/>

  <!-- Top Crown Leaves -->
  <ellipse cx="280" cy="135" rx="30" ry="48" fill="#2E8B57" transform="rotate(-12 280 135)"/>
  <ellipse cx="320" cy="125" rx="30" ry="48" fill="#3DA86A" transform="rotate(12 320 125)"/>
  <ellipse cx="300" cy="110" rx="22" ry="42" fill="#236B43"/>

  <!-- Leaf veins -->
  <line x1="195" y1="332" x2="225" y2="347" stroke="#236B43" stroke-width="1" opacity="0.4"/>
  <line x1="405" y1="312" x2="375" y2="327" stroke="#236B43" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="110" x2="300" y2="150" stroke="#1a5c3a" stroke-width="1" opacity="0.3"/>

  <!-- Shield -->
  <g transform="translate(300, 420)">
    <path d="M0 -55 Q-45 -45 -55 -12 Q-55 35 0 60 Q55 35 55 -12 Q45 -45 0 -55Z" fill="url(#shieldGrad)" opacity="0.92"/>
    <path d="M0 -40 Q-32 -33 -40 -8 Q-40 28 0 45 Q40 28 40 -8 Q32 -33 0 -40Z" fill="white" opacity="0.15"/>
    <path d="M-14 2 L-5 11 L16 -10" stroke="white" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Spray droplets -->
  <circle cx="155" cy="310" r="5" fill="#4FC3F7" opacity="0.5"/>
  <circle cx="170" cy="240" r="4" fill="#4FC3F7" opacity="0.4"/>
  <circle cx="445" cy="295" r="5" fill="#4FC3F7" opacity="0.5"/>
  <circle cx="435" cy="220" r="4" fill="#4FC3F7" opacity="0.4"/>
  <circle cx="248" cy="170" r="4" fill="#4FC3F7" opacity="0.35"/>
  <circle cx="352" cy="160" r="4" fill="#4FC3F7" opacity="0.35"/>

  <!-- Stars -->
  <g fill="#FFD700" opacity="0.65">
    <polygon points="150,175 153,185 163,185 155,191 158,201 150,195 142,201 145,191 137,185 147,185"/>
    <polygon points="450,190 453,197 460,197 455,202 457,209 450,204 443,209 445,202 440,197 447,197"/>
    <polygon points="345,90 347,97 354,97 349,102 351,109 345,104 339,109 341,102 336,97 343,97"/>
    <polygon points="255,88 257,93 262,93 258,97 260,102 255,98 250,102 252,97 248,93 253,93"/>
  </g>

  <!-- Product bottles -->
  <g transform="translate(110, 420)" opacity="0.7">
    <rect x="0" y="0" width="26" height="40" rx="5" fill="#E53935"/>
    <rect x="4" y="-6" width="18" height="10" rx="3" fill="#C62828"/>
    <rect x="3" y="6" width="20" height="6" rx="1" fill="white" opacity="0.3"/>
  </g>
  <g transform="translate(462, 400)" opacity="0.7">
    <rect x="0" y="0" width="26" height="40" rx="5" fill="#1565C0"/>
    <rect x="4" y="-6" width="18" height="10" rx="3" fill="#0D47A1"/>
    <rect x="3" y="6" width="20" height="6" rx="1" fill="white" opacity="0.3"/>
  </g>

  <!-- Dots -->
  <circle cx="130" cy="460" r="3" fill="#FFD700" opacity="0.4"/>
  <circle cx="470" cy="450" r="3" fill="#FFD700" opacity="0.4"/>
  <circle cx="200" cy="150" r="2.5" fill="#2E8B57" opacity="0.3"/>
  <circle cx="400" cy="140" r="2.5" fill="#2E8B57" opacity="0.3"/>
</svg>
